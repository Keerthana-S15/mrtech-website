# =============================================================================
# MRTech — one service, exactly like production: Express serves the compiled
# React app and the /api routes from the same port.
#
#   docker compose up --build        start
#   docker compose down              stop
#
# Requires two files that are gitignored, so each developer supplies their own:
#   backend/.env                     copy from backend/.env.example
#   backend/serviceAccountKey.json   Firebase service-account key
# See DOCKER.md.
# =============================================================================

services:
  mrtech:
    build:
      context: .
      dockerfile: Dockerfile
    image: mrtech:latest
    container_name: mrtech

    # HOST_PORT:CONTAINER_PORT — change the host side with HOST_PORT=8080 if
    # 3000 is taken. The container always listens on 3000.
    ports:
      - "${HOST_PORT:-3000}:3000"

    # Secrets stay in this file on the host; they are never copied into the
    # image (.dockerignore excludes **/.env).
    env_file:
      - ./backend/.env

    # Set after env_file, so these win regardless of what .env says.
    environment:
      NODE_ENV: production
      PORT: 3000

    volumes:
      # Admin-panel uploads persist across rebuilds and `down`. This is the
      # local equivalent of the persistent-disk problem on Render, where
      # /uploads is wiped on every deploy.
      - mrtech_uploads:/app/backend/uploads

      # Firebase credentials, mounted read-only rather than baked in.
      # Alternative: drop this mount and set FIREBASE_SERVICE_ACCOUNT in
      # backend/.env to the key JSON on a single line — config/firebase.js
      # prefers the env var when it is present.
      - ./backend/serviceAccountKey.json:/app/backend/serviceAccountKey.json:ro

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  mrtech_uploads:
